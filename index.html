<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier Pets Clinic — Price List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf7ee;
    --paper:#ffffff;
    --ink:#262b21;
    --ink-soft:#656b58;
    --ink-faint:#9a9d8c;
    --sage:#5f6e55;
    --sage-deep:#2c3425;
    --sage-pale:#eef1e4;
    --gold:#c79a4b;
    --gold-deep:#8f6a28;
    --line:#e6e0cd;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  svg.sprite{position:absolute;width:0;height:0;overflow:hidden;}

  .wrap{max-width:720px;margin:0 auto;padding:0 20px 70px;}

  /* ---------- Hero ---------- */
  header{
    background:var(--sage-deep);
    color:#f4f2e6;
    padding:56px 20px 110px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .paw-deco{
    position:absolute;
    color:rgba(244,242,230,.09);
    pointer-events:none;
    z-index:1;
  }
  header .wrap{position:relative;z-index:2;padding:0;}
  .hero-ring{
    width:220px;height:220px;
    border:1px solid rgba(244,242,230,.16);
    border-radius:50%;
    position:absolute;
    left:50%;top:-70px;
    transform:translateX(-50%);
    z-index:1;
  }
  .hero-ring.r2{width:340px;height:340px;top:-130px;border-color:rgba(244,242,230,.08);}
  .logo-medal{
    width:150px;height:150px;
    border-radius:50%;
    background:#f4f2e6;
    margin:0 auto 22px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px rgba(244,242,230,.3), 0 0 0 9px rgba(199,154,75,.14), 0 16px 40px rgba(0,0,0,.3);
  }
  .logo-medal img{width:118px;height:118px;object-fit:contain;display:block;}
  .eyebrow{
    text-transform:uppercase;letter-spacing:.18em;font-size:11px;
    color:var(--gold);font-weight:600;margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(30px,8vw,42px);
    line-height:1.08;
    margin:0 0 6px;
  }
  .ar-name{
    font-size:14px;
    color:#c7c9b4;
    direction:rtl;
    margin:0 0 18px;
  }
  .rule{
    width:46px;height:2px;background:var(--gold);
    margin:0 auto 18px;
    border-radius:2px;
  }
  header p.tag{
    color:#d3d4c2;
    font-size:15px;
    max-width:40ch;
    margin:0 auto;
    line-height:1.6;
  }

  /* ---------- Sticky category nav ---------- */
  nav.cats{
    position:sticky;top:0;z-index:10;
    background:rgba(250,247,238,.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    margin-top:-54px;
  }
  nav.cats .inner{
    max-width:720px;margin:0 auto;
    display:flex;gap:8px;overflow-x:auto;
    padding:14px 20px;
    scrollbar-width:none;
  }
  nav.cats .inner::-webkit-scrollbar{display:none;}
  nav.cats a{
    flex:0 0 auto;
    font-size:12.5px;font-weight:600;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    padding:8px 15px;
    border-radius:100px;
    text-decoration:none;
    white-space:nowrap;
    transition:border-color .15s, color .15s;
  }
  nav.cats a:hover{border-color:var(--gold-deep);color:var(--gold-deep);}

  /* ---------- Doctor card ---------- */
  .doctor{
    margin-top:28px;
    display:flex;
    align-items:center;
    gap:18px;
    background:var(--sage-pale);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
  }
  .doctor .avatar{
    width:76px;height:76px;
    border-radius:50%;
    flex-shrink:0;
    background:var(--paper);
    border:2px solid var(--gold);
    padding:2px;
  }
  .doctor .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17.5px;
    color:var(--sage-deep);
    margin:0 0 2px;
  }
  .doctor .role{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--gold-deep);
    font-weight:700;
    margin:0 0 6px;
  }
  .doctor .bio{
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.55;
  }

  /* ---------- Sections ---------- */
  section.cat{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:22px;
    padding:30px 24px 32px;
    margin-top:26px;
    box-shadow:0 1px 0 rgba(0,0,0,.02), 0 18px 40px -12px rgba(44,52,37,.12);
    scroll-margin-top:84px;
  }
  section.cat:first-of-type{margin-top:22px;}
  .cat-head{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:4px;
  }
  .cat-icon{
    width:46px;height:46px;
    border-radius:50%;
    background:linear-gradient(145deg, var(--sage) 0%, var(--sage-deep) 100%);
    color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 4px 10px rgba(44,52,37,.25);
  }
  .cat-icon svg{width:20px;height:20px;}
  .cat-titles{min-width:0;}
  h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    color:var(--sage-deep);
    line-height:1.2;
  }
  .cat-note{
    font-size:13px;
    color:var(--ink-soft);
    margin:2px 0 0;
    line-height:1.5;
  }
  .cat-rule{
    height:1px;
    background:linear-gradient(to right, var(--gold) 0 40px, var(--line) 40px 100%);
    margin:16px 0 14px;
  }

  /* ---------- Subgroup headings (Cat/Dog, Basic/Full Grooming, etc.) ---------- */
  .subhead-row{
    display:flex;align-items:center;gap:8px;
    margin:22px 0 2px;
  }
  .subhead-row.first{margin-top:4px;}
  .subhead{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:11.5px;
    color:var(--gold-deep);
    text-transform:uppercase;
    letter-spacing:.08em;
    background:var(--sage-pale);
    padding:4px 10px;
    border-radius:100px;
  }
  .subhead-line{flex:1;height:1px;background:var(--line);}
  .subnote{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:6px 0 10px;
    line-height:1.5;
  }

  .row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row .name{
    font-size:15px;
    font-weight:500;
    color:var(--ink);
  }
  .row .desc{
    display:block;
    font-size:12.5px;
    font-weight:400;
    color:var(--ink-faint);
    margin-top:2px;
    line-height:1.4;
  }
  .row .price{
    font-family:'Space Mono',monospace;
    font-size:14.5px;
    font-weight:700;
    color:var(--sage-deep);
    white-space:nowrap;
    padding-top:1px;
  }
  .row .price .cur{
    font-size:10.5px;
    font-weight:400;
    color:var(--ink-faint);
    margin-right:3px;
  }
  .row.highlight{
